
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | StudySphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            color: #1e293b;
        }

        .signup-card {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(79, 70, 229, 0.12);
        }

        .logo {
            display: block;
            text-align: center;
            margin-bottom: 25px;
            color: #4f46e5;
            font-size: 29px;
            font-weight: bold;
            text-decoration: none;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 27px;
        }

        form {
            display: grid;
            gap: 13px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px #6366f11a;
        }

        button {
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .message {
            margin-bottom: 16px;
            padding: 11px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        .bottom-text {
            margin-top: 23px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .bottom-text a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 27px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="signup-card">
        <a href="/" class="logo">StudySphere.</a>

        <h1>Create Account</h1>
        <p class="subtitle">Join the community. Learn and grow together.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                maxlength="150"
                autocomplete="username"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a strong password"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Enter password again"
                autocomplete="new-password"
                required
            >

            <button type="submit">Create Account</button>
        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>

        <a href="/" class="home-link">← Back to Home</a>
    </main>
</body>
</html>
