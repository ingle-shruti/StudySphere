
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | StudySphere</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            width: 350px;
            max-width: 85%;
            box-shadow: 0 5px 20px #00000015;
        }
        h2 {
            text-align: center;
            color: #2563eb;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if validlink %}
            <h2>Set New Password</h2>
            <p>Enter your new password below.</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Reset Password</button>
            </form>

        {% else %}
            <h2>Invalid or Expired Link</h2>
            <p class="error">
                This password reset link is invalid or has expired.
            </p>
            <a href="{% url 'password_reset' %}">Request a New Link</a>
        {% endif %}
    </div>
</body>
</html>
