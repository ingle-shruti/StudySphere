
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Username | StudySphere</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f4edff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 35px #28326420;
        }

        h2 {
            color: #4f46e5;
            text-align: center;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            color: #166534;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Forgot Username?</h2>

        <p>
            Enter the email address you used when creating
            your StudySphere account.
        </p>

        <form method="POST">
            {% csrf_token %}

            <input
                type="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <button type="submit">Recover Username</button>
        </form>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <a href="{% url 'login' %}">Back to Login</a>
    </div>
</body>
</html>
