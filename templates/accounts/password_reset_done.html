
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Requested | StudySphere</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 5px 20px #00000015;
        }
        h2 { color: #2563eb; }
        p { color: #475569; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Check Your Email</h2>
        <p>
            If an account matches the email address you entered,
            password reset instructions have been sent.
        </p>
        <p>Check your email or spam folder for the reset instructions.</p>
        <a href="{% url 'login' %}">Back to Login</a>
    </div>
</body>
</html>
