
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | StudySphere</title>
</head>
<body>
    <h1>Forgot Password?</h1>
    <p>Enter your registered email to get a password reset link.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset Link</button>
    </form>

    <a href="{% url 'login' %}">Back to Login</a>
</body>
</html>
